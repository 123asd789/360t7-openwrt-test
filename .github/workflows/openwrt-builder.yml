name: Build 360T7 U-Boot Layout Firmware (ImmortalWrt mt798x)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (e.g., main)'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: false
        haskell: false
        large-storage: false
        docker-images: false

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev xsltproc libxml-parser-perl libelf-dev unzip zlib1g-dev wget python3 python3-setuptools swig rsync bc
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Clone Chasey-dev ImmortalWrt mt798x-rebase Source
      run: |
        git clone https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
        cd openwrt
        # 如果有特定分支可以 checkout，例如：git checkout main

    - name: Inject Custom Files & Patches
      run: |
        cd openwrt
        
        # 1. 复制您的自定义 DTS 文件到源码目录
        # 注意：请确认 mt7981b-qihoo-360t7.dts 中的 include 路径或文件名是否与该仓库原生的一致
        cp ../custom/mt7981b-qihoo-360t7.dts target/linux/mediatek/dts/
        cp ../custom/mt7981b-qihoo-360t7-common.dtsi target/linux/mediatek/dts/
        
        # 2. 打入 filogic.mk 的 patch（如果该仓库的 filogic.mk 结构有差异，patch 可能会有冲突，后面有提示）
        patch -p1 < ../custom/filogic.mk.patch || echo "Patch applied with warnings or already integrated"
        
        # 3. 复制您的 .config 文件到源码根目录
        cp ../custom/.config .config

    - name: Configure and Download Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # 使 .config 生效并补全依赖
        make defconfig

    - name: Compile Firmware
      run: |
        cd openwrt
        # 多线程编译 (V=s 开启详细日志方便排查错误)
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files and Upload
      run: |
        mkdir -p final_firmware
        cp openwrt/bin/targets/mediatek/filogic/*.bin final_firmware/ || true
        cp openwrt/bin/targets/mediatek/filogic/*.tar final_firmware/ || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-360t7-uboot-firmware
        path: final_firmware/*
