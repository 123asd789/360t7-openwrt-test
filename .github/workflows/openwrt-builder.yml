name: Build 360T7 U-Boot Layout Firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt Version (e.g., v24.10.0 or snapshot)'
        required: true
        default: 'snapshot'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev xsltproc libxml-parser-perl libelf-dev unzip zlib1g-dev wget python3 python3-setuptools swig rsync bc
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Download OpenWrt Image Builder
      run: |
        # 以 MediaTek Filogic 架构为例 (根据实际 OpenWrt 版本调整下载链接)
        # 此处以 snapshot 的 mediatek/filogic 为例
        wget https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/openwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.xz
        tar -xJf openwrt-imagebuilder-*.tar.xz
        mv openwrt-imagebuilder-* builder
        cd builder
        
        # 清理并准备替换定制的 DTS 和 Makefile 规则
        # 将您修改好的 DTS 放入 builder/target/linux/mediatek/dts/
        # 将 filogic.mk 的修改应用进去

    - name: Inject Custom DTS & Rules
      run: |
        cd builder
        # 将仓库中的自定义 DTS 复制到 Image Builder 的 dts 目录
        cp ../custom/mt7981b-qihoo-360t7.dts target/linux/mediatek/dts/
        cp ../custom/mt7981b-qihoo-360t7-common.dtsi target/linux/mediatek/dts/
        
        # 将 filogic.mk 的修改补丁打入
        patch -p1 < ../custom/filogic.mk.patch

    - name: Build Firmware
      run: |
        cd builder
        # 执行 make image 编译出 360T7 (uboot layout) 的固件
        # 包含了必要的驱动和自定义打包
        make image PROFILE="qihoo_360t7" PACKAGES="kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware luci"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-360t7-uboot-factory
        path: |
          builder/bin/targets/mediatek/filogic/*.bin
          builder/bin/targets/mediatek/filogic/*.tar
